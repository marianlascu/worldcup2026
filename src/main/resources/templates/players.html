<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sport Predictor - Players</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div th:replace="~{fragments/layout :: appLayout(
        'Players',
        'players',
        ~{::content}
    )}">

    <div th:fragment="content">

        <section class="card players-card">

            <div class="players-header">

                <div>
                    <h2>Players CRUD</h2>

                    <p>
                        Aici vom gestiona participanții: add, update, delete.
                    </p>
                </div>

            </div>

            <div class="players-table-wrap">

                <table class="players-table">

                    <thead>
                    <tr>
                        <th>Username</th>
                        <th>Full name</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr>
                        <td data-label="Username">
                            marian
                        </td>

                        <td data-label="Full name">
                            Marian
                        </td>

                        <td data-label="Role">
                            PLAYER
                        </td>

                        <td data-label="Actions"
                            class="players-actions">
                            Edit | Delete
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </div>

</div>

</body>
</html>
